<div class="login-page">
  <form class="card login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>☕ CoffeeOps</h1>
    <p class="muted">Sign in to the backoffice</p>

    @if (error()) {
      <p class="alert alert-error">{{ error() }}</p>
    }

    <label class="field">
      Username
      <input formControlName="username" autocomplete="username" />
      @if (form.controls.username.touched && form.controls.username.invalid) {
        <span class="field-error">Username is required</span>
      }
    </label>

    <label class="field">
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">Password is required</span>
      }
    </label>

    <button type="submit" class="btn btn-block" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
