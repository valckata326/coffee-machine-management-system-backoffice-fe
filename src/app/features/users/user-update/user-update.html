<form class="card form" [formGroup]="form" (ngSubmit)="submit()">
  <h2>Update user</h2>

  @if (error()) {
    <p class="alert alert-error">{{ error() }}</p>
  }

  <label class="field">
    User id
    <input type="number" min="1" formControlName="userId" />
    @if (form.controls.userId.touched && form.controls.userId.invalid) {
      <span class="field-error">User id is required</span>
    }
  </label>

  <label class="field">
    New role id <span class="muted">(optional)</span>
    <input type="number" min="1" formControlName="roleId" />
  </label>

  <label class="field">
    Status
    <select formControlName="active">
      <option value="">No change</option>
      <option value="true">Active</option>
      <option value="false">Deactivated</option>
    </select>
  </label>

  @if (form.touched && form.hasError('noChange')) {
    <span class="field-error">Change the role or the status.</span>
  }

  <div class="actions">
    <button type="submit" class="btn" [disabled]="saving()">Update</button>
  </div>
</form>
